general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Opt-in: let CheckBatchCost track cost for unmanaged batches created with a raw
  # gs:// (Vertex) or s3:// (Bedrock) input_file_id. Requires a matching deployment
  # configured for the batched model. Defaults to false.
  # track_unmanaged_batch_cost: true

sandbox_tools:
  - sandbox_tool_name: e2b_sandbox
    litellm_params:
      sandbox_provider: e2b
      api_key: os.environ/E2B_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 3
  fallbacks: 
    - {"anthropic-haiku-4-5": ["bedrock-invoke-haiku-4-5", "vertex-haiku-4-5"]}
    - {"gpt-4o-mini": ["devstral"]}

litellm_settings:
  drop_params: True
  telemetry: False
  success_callback: ["prometheus", "otel"]
  failure_callback: ["prometheus", "otel"]
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  code_interpreter_interception_params:
    enabled: true
    sandbox_tool_name: e2b_sandbox
  callbacks:
    - code_interpreter_interception

service_management:
  services:
    - name: ollama
      display_name: Ollama
      description: "Local open-source model runtime. Serves models on :11434."
      docs_url: "https://ollama.com"
      kind: brew
      health_port: 11434
      start_cmd: [brew, services, start, ollama]
      stop_cmd: [brew, services, stop, ollama]
      restart_cmd: [brew, services, restart, ollama]
    - name: postgres
      display_name: PostgreSQL
      description: "Proxy database (virtual keys, teams, spend, logs)."
      docs_url: "https://www.postgresql.org"
      kind: brew
      prevent_stop: true
      health_port: 5432
      start_cmd: [brew, services, start, "postgresql@18"]
      stop_cmd: [brew, services, stop, "postgresql@18"]
      restart_cmd: [brew, services, restart, "postgresql@18"]
    - name: redis
      display_name: Redis
      description: "Optional cache / coordination backend for the proxy."
      docs_url: "https://redis.io"
      kind: brew
      prevent_stop: true
      health_port: 6379
      start_cmd: [brew, services, start, redis]
      stop_cmd: [brew, services, stop, redis]
      restart_cmd: [brew, services, restart, redis]

    - name: agents
      display_name: Agents
      description: "Agent stack (Postgres + Redis) from /opt/Developer/SourceCode/AI/agents."
      kind: docker_compose
      health_port: 5432
      start_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/agents/docker-compose.yml, up, -d]
      stop_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/agents/docker-compose.yml, down]
      restart_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/agents/docker-compose.yml, restart]
    - name: firecrawl
      display_name: Firecrawl
      description: "Self-hosted Firecrawl scraping API. App on :3002."
      kind: docker_compose
      health_port: 3002
      start_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/firecrawl/docker-compose.yaml, up, -d]
      stop_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/firecrawl/docker-compose.yaml, down]
      restart_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/firecrawl/docker-compose.yaml, restart]
    - name: mirofish
