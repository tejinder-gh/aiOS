      kind: docker_compose
      health_port: 3000
      start_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/MiroFish/docker-compose.yml, up, -d]
      stop_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/MiroFish/docker-compose.yml, down]
      restart_cmd: [docker, compose, -f, /opt/Developer/SourceCode/AI/MiroFish/docker-compose.yml, restart]
    - name: omniroute
